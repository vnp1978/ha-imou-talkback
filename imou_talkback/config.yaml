name: "Imou Talkback"
version: "1.3.4"
slug: imou_talkback
description: "Phát TTS qua loa camera Imou LAN. Không cần cloud account."
url: "https://github.com/YOUR_USERNAME/ha-imou-talkback"
arch:
  - amd64
  - aarch64
  - armv7

ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: "Web UI & API"

options:
  cameras: []
  tts_language: "vi"
  tts_engine: "gtts"

schema:
  cameras:
    - name: str
      host: str
      password: str
      port: "int(1,65535)?"
  tts_language: "list(vi|en|ja|ko|zh|fr|de|es)"
  tts_engine: "list(gtts)"

map:
  - type: share
    read_only: false

stage: experimental
init: false
startup: application

panel_icon: mdi:microphone
